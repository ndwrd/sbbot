}

# naive/anytls — сырые TLS-туннели (не HTTP: naive — HTTP/2 CONNECT-туннель,
# который nginx http{}-уровень (ни proxy_pass, ни grpc_pass) не может надёжно
# ретранслировать не интерпретируя; anytls — вообще не HTTP), поэтому оба
# терминируются отдельно через stream-модуль на своих портах, в которые `up`
# направляет соответствующий SNI-поддомен (см. upstream.conf).
# `stream{}` — top-level директива, может быть только одна на файл, поэтому
# оба протокола делят один блок, каждый — свой server{} с собственным маркером.
stream {
    #-naive
    # server {
    #     listen 10.10.0.2:8447 ssl proxy_protocol;
    #     listen 10.10.1.2:8447 ssl;
