# Шаблон. cloakNginx() (BotDomainSslTrait) читает его, подставляет домен,
# дописывает hash к /webapp|/pac|/ws, раскомментирует нужные блоки — и пишет
# результат в config/nginx.conf, который и смонтирован в контейнер ng как
# /etc/nginx/nginx.conf. Правки вносить СЮДА: nginx.conf перезаписывается при
# каждом старте service.php.
#
# config/nginx.conf в репозитории — стартовая копия этого же файла, байт в байт.
# Она нужна потому, что docker-compose монтирует этот путь ещё до того, как
# cloakNginx() успеет отработать (а если файла нет, Docker создаст на его месте
# директорию, и nginx не поднимется). Копия уже успевала разъехаться с шаблоном
# и потерять limit_req_zone и фильтр методов, так что инвариант простой:
#     diff config/nginx.conf config/nginx_default.conf
# должен быть пустым.
#
# Апстримы заданы статическими адресами из docker-compose.yml, а не именами
# сервисов, и это важно: сети compose подняты с enable_ipv6, поэтому встроенный
# DNS Docker отдаёт на имя и A, и AAAA. nginx резолвит имя в оба адреса и
# раскладывает соединения по кругу, а слушателей на IPv6 нет ни у кого: unit
# слушает "*:80" (только IPv4), sing-box — "0.0.0.0", сам ng — литералы
# 10.10.0.2/10.10.1.2. Каждое второе соединение получало connect() failed
# (111: Connection refused), шло вторым заходом на IPv4 и засоряло лог.
# Адреса: php 10.10.0.7, sbx 10.10.0.19, ng 10.10.0.2 — см. docker-compose.yml.
user nginx;
worker_processes auto;

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

error_log /logs/nginx_error;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;
    server_tokens off;
    include override.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Stateless, in-memory only (nothing written to disk/log, no per-IP history
    # kept beyond nginx's own sliding window) — throttles automated scanning of
    # the decoy site without banning anyone. A real visitor loading the decoy
    # page never gets close to this; only rapid automated requests do.
    limit_req_zone $binary_remote_addr zone=decoy:10m rate=5r/s;

    real_ip_header proxy_protocol;
    real_ip_recursive on;
    set_real_ip_from 10.10.0.10;

    # WEB-прокси Telemt: транспорты websocket/websocket-lanes приходят как HTTP
    # Upgrade, а https/https-lanes — обычными запросами. Connection передаём
    # только когда клиент действительно просит Upgrade.
    map $http_upgrade $telemt_connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80 default_server;

        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 444;
        }

        #-hostcheck
        # if ($host !~ "^(HOSTCHECK_DOMAIN|HOSTCHECK_NAIVE|HOSTCHECK_ANYTLS|HOSTCHECK_WEB)$") {
        #     return 444;
        # }
        #-hostcheck

        location / {
            return 301 https://$host$request_uri;
        }
        location ~\.well-known {
            access_log /logs/nginx_certbot_access;
            root /certs/;
            try_files $uri =404;
        }

        error_page 400 403 404 405 =444 /dev/null;
    }

    server {
        listen 10.10.0.2:443 ssl proxy_protocol default_server;
        listen 10.10.1.2:443 ssl default_server;
        # Отдельной директивой, а не параметром listen: с nginx 1.25.1 форма
        # `listen ... http2` объявлена устаревшей и на каждом `nginx -t` даёт
        # варнинг (в 1.24 из Alpine 3.18 его ещё не было). Поведение то же.
        http2 on;
        ssl_certificate /certs/self_public;
        ssl_certificate_key /certs/self_private;

        access_log /logs/nginx_ip_access;

        # /app тут — это ./app/webapp (см. docker-compose), а он же раздаётся
        # наружу через `location /webapp` (alias /app), причём без auth_basic.
        # Без этого правила .htpasswd декоя спокойно скачивался бы запросом
        # /webapp{hash}/.htpasswd. Регексп-location проверяется раньше
        # префиксных, так что закрывает и /webapp, и /. На сам auth_basic это
        # не влияет: nginx читает файл с диска, а не через location.
        location ~ /\.ht {
            deny all;
        }

        location = / {
            root /app;
            try_files $uri /override.html @auth;
        }

        location /override/ {
            alias /app/override/;
            try_files $uri =404;
        }

        location / {
            root /app;
            limit_req zone=decoy burst=10 nodelay;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }
        location @auth {
            root /app;
            # Тот же лимит, что и в `location /`: сюда падает `location = /`
            # через try_files, когда override.html не положили — то есть у
            # дефолтной установки это основной путь на декой, и без лимита он
            # оставался незащищённым.
            limit_req zone=decoy burst=10 nodelay;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }

        location /tlgrm {
            access_log /logs/nginx_tlgrm_access;
            proxy_pass http://10.10.0.7:80;
        }

        location @php {
            proxy_pass http://10.10.0.7:80;
        }

        location /webapp {
            access_log /logs/nginx_webapp_access;
            alias /app;
            index index.html;
            try_files $uri $uri/ @php;
        }

        location /pac {
            access_log /logs/nginx_pac_access;
            proxy_set_header Host $http_host;
            proxy_pass http://10.10.0.7:80;
        }

        location /ws {
            proxy_pass http://10.10.0.19:443;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5d;
        }

        include location.conf;
    }

    #~

    # Внутренний сайт-обманка для WEB-прокси: Telemt отдаёт сюда всё, что не
    # опознал как свой клиент (decoy http_upstream). Тот же сайт, что и на
    # основном домене, включая загруженный override.html, — но обычным HTTP на
    # внутреннем адресе: TLS для WEB-имени уже снят ниже, в WEB-блоке.
    # Наружу не опубликован.
    server {
        listen 10.10.0.2:8088;

        location ~ /\.ht {
            deny all;
        }
        location = / {
            root /app;
            try_files $uri /override.html @auth;
        }
        location /override/ {
            alias /app/override/;
            try_files $uri =404;
        }
        location / {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }
        location @auth {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }
    }

    # WEB-прокси Telemt (включается в меню MTProto, см. cloakNginx()). TLS
    # снимает ng — сертификат тот же, в нём есть WEB-имя, — а весь vhost уходит
    # в WEB-listener Telemt: по документации Telemt отдавать ему нужно ВСЕ пути
    # имени, иначе обычные и авторизованные запросы начнут отличаться снаружи.
    # X-Forwarded-For — реальный адрес клиента из proxy_protocol (real_ip выше);
    # Telemt доверяет ему только от адреса ng (web_trusted_proxy_cidrs).
    #-web
    # server {
    #     server_name WEBHOST;
    #     listen 10.10.0.2:443 ssl proxy_protocol;
    #     listen 10.10.1.2:443 ssl;
    #     http2 on;
    #     ssl_certificate /certs/cert_public;
    #     ssl_certificate_key /certs/cert_private;
    #     access_log off;
    #     client_max_body_size 2m;

    #     location / {
    #         proxy_pass http://10.10.0.8:18080;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $telemt_connection_upgrade;
    #         proxy_connect_timeout 5s;
    #         proxy_send_timeout 65s;
    #         proxy_read_timeout 65s;
    #         proxy_request_buffering off;
    #         proxy_buffering off;
    #         proxy_next_upstream off;
    #     }
    # }
    #-web


    #-domain
    # server {
    #     server_name domain;
    #     listen 10.10.0.2:443 ssl proxy_protocol;
    #     listen 10.10.1.2:443 ssl;
    #     http2 on;
    #     ssl_certificate /certs/cert_public;
    #     ssl_certificate_key /certs/cert_private;

    #     access_log /logs/nginx_domain_access;

    #     location ~ /\.ht {
    #         deny all;
    #     }

    #     location = / {
    #         root /app;
    #         try_files $uri /override.html @auth;
    #     }

    #     location /override/ {
    #         alias /app/override/;
    #         try_files $uri =404;
    #     }

    #     location / {
    #         root /app;
    #         limit_req zone=decoy burst=10 nodelay;
    #         auth_basic "Restricted Content";
    #         auth_basic_user_file /app/.htpasswd;
    #         try_files $uri =404;
    #     }
    #     location @auth {
    #         root /app;
    #         limit_req zone=decoy burst=10 nodelay;
    #         auth_basic "Restricted Content";
    #         auth_basic_user_file /app/.htpasswd;
    #         try_files $uri =404;
    #     }

    #     location @php {
    #         proxy_pass http://10.10.0.7:80;
    #     }

    #     location /webapp {
    #         access_log /logs/nginx_webapp_access;
    #         alias /app;
    #         index index.html;
    #         try_files $uri $uri/ @php;
    #     }

    #     location /pac {
    #         access_log /logs/nginx_pac_access;
    #         proxy_set_header Host $http_host;
    #         proxy_pass http://10.10.0.7:80;
    #     }

    #     location /ws {
    #         proxy_pass http://10.10.0.19:443;
    #         proxy_redirect off;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_read_timeout 5d;
    #     }

    #     include location.conf;
    # }
