user  nginx;
worker_processes  auto;

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

error_log  /logs/upstream_error;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    include /etc/nginx/deny;
    log_format basic '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received';
    access_log /logs/upstream_access basic;

    # Статические адреса вместо имён сервисов — по той же причине, что и в
    # nginx_default.conf: с enable_ipv6 в сетях DNS Docker отдаёт AAAA, nginx
    # раскладывает соединения по обоим адресам, а на IPv6 никто не слушает.
    upstream other {
        server 10.10.0.2:443;
    }

    upstream reality {
        server 10.10.0.19:443;
    }

    upstream ng-anytls {
        server 10.10.0.2:8446;
    }

    upstream ng-naive {
        server 10.10.0.2:8447;
    }

    map_hash_bucket_size 128;
    map $ssl_preread_server_name $sni_name {
        #domain
        t reality;
        #domain
        #naive
        #naive
        #anytls
        #anytls
        default other;
    }

    server {
        listen          443 reuseport;
        proxy_pass      $sni_name;
        proxy_protocol  on;
        ssl_preread     on;
    }
}
