name: build sing-box image

on:
  push:
    branches: [main]
    paths:
      - 'dockerfile/singbox.dockerfile'
      - '.github/workflows/build-singbox.yml'
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box tag to build (blank = dockerfile default)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/vpnbot-sbx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/singbox.dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ${{ github.event.inputs.sing_box_version != '' && format('SING_BOX_VERSION={0}', github.event.inputs.sing_box_version) || '' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
