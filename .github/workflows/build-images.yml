name: build images

on:
  push:
    branches: [main]
    paths:
      - 'dockerfile/**'
      - '.env'                     # тут лежит базовый образ (IMAGE), см. шаг "build args"
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box tag to build for the sbx image (blank = dockerfile default)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # base_image: true — образу нужен ARG image, он берётся из IMAGE в .env.
        # Раньше версия была продублирована здесь строкой alpine:3.18.2 и разъехалась
        # бы с .env при первом же обновлении: php.dockerfile просил бы php84, а
        # сборка шла на 3.18, где такого пакета нет, и CI падал бы.
        include:
          - name: ng
            dockerfile: dockerfile/nginx.dockerfile
            base_image: true
          - name: php
            dockerfile: dockerfile/php.dockerfile
            base_image: true
          - name: wg
            dockerfile: dockerfile/wireguard.dockerfile
            base_image: true
          - name: dnstt
            dockerfile: dockerfile/dnstt.dockerfile
            base_image: true
          - name: sbx
            dockerfile: dockerfile/singbox.dockerfile
            base_image: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: repository (lowercase, GHCR requires it)
        id: repo
        shell: bash
        run: |
          # value — owner/repo для тега образа (ghcr.io/owner/repo/имя)
          # name  — только repo, из него складывается ИМЯ ПАКЕТА: "repo/имя".
          #         GitHub видит пакет именно так, а не просто как "имя" —
          #         это нужно шагу очистки старых версий ниже.
          echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build args
        id: args
        shell: bash
        run: |
          # Базовый образ — единственным источником из .env, той же строкой, что
          # использует docker compose локально и на сервере.
          IMAGE=$(grep -m1 '^IMAGE=' .env | cut -d= -f2-)
          if [ -z "$IMAGE" ]; then
            echo "IMAGE не найден в .env" >&2
            exit 1
          fi
          echo "базовый образ: $IMAGE"
          args=""
          if [ "${{ matrix.base_image }}" = "true" ]; then
            args="image=$IMAGE"
          fi
          if [ "${{ matrix.name }}" = "sbx" ] && [ -n "${{ github.event.inputs.sing_box_version }}" ]; then
            args="$args
          SING_BOX_VERSION=${{ github.event.inputs.sing_box_version }}"
          fi
          {
            echo "value<<EOF"
            echo "$args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.value }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.value }}/${{ matrix.name }}:${{ github.sha }}

      # Каждая сборка добавляет версию с тегом :<sha>, и они копятся без конца.
      # Оставляем 10 последних, остальное удаляем.
      #
      # Шаг идёт ПОСЛЕ публикации и помечен continue-on-error: если прав не
      # хватит (GITHUB_TOKEN умеет удалять версии не во всех конфигурациях —
      # для пакетов, принадлежащих пользователю, а не организации, может
      # понадобиться PAT с delete:packages), сборка всё равно считается
      # успешной. Образ важнее уборки.
      - name: prune old package versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ steps.repo.outputs.name }}/${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 10
          # :latest всегда среди свежих, так что под удаление он не попадёт,
          # но перестраховываемся явно — без него откатиться будет не на что.
          ignore-versions: '^latest$'
