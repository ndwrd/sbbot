name: build images

on:
  push:
    branches: [main]
    paths:
      - 'dockerfile/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box tag to build for the sbx image (blank = dockerfile default)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ng
            dockerfile: dockerfile/nginx.dockerfile
            image_arg: alpine:3.18.2
          - name: php
            dockerfile: dockerfile/php.dockerfile
            image_arg: alpine:3.18.2
          - name: ad
            dockerfile: dockerfile/adguard.dockerfile
            image_arg: ''
          - name: tg
            dockerfile: dockerfile/telegram.dockerfile
            image_arg: ''
          - name: wg
            dockerfile: dockerfile/wireguard.dockerfile
            image_arg: alpine:3.18.2
          - name: dnstt
            dockerfile: dockerfile/dnstt.dockerfile
            image_arg: alpine:3.18.2
          - name: sbx
            dockerfile: dockerfile/singbox.dockerfile
            image_arg: alpine:3.18.2
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: repository (lowercase, GHCR requires it)
        id: repo
        shell: bash
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build args
        id: args
        shell: bash
        run: |
          args=""
          if [ -n "${{ matrix.image_arg }}" ]; then
            args="image=${{ matrix.image_arg }}"
          fi
          if [ "${{ matrix.name }}" = "sbx" ] && [ -n "${{ github.event.inputs.sing_box_version }}" ]; then
            args="$args
          SING_BOX_VERSION=${{ github.event.inputs.sing_box_version }}"
          fi
          {
            echo "value<<EOF"
            echo "$args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.value }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.value }}/${{ matrix.name }}:${{ github.sha }}
